[package]
name = "sessionrpc"
version = "0.1.0"
edition = "2024"
description = "GPU-session-aware bidirectional streaming RPC for stateful inference fleets"
license = "Apache-2.0"
repository = "https://github.com/EvalOps/sessionrpc"
readme = "README.md"
keywords = ["rpc", "streaming", "inference", "gpu", "sessions"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = "1.11"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt", "sync"] }
uuid = { version = "1.20", features = ["v4"] }
