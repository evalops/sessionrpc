[package]
name = "sessionrpc"
version = "0.1.0"
edition = "2024"
description = "GPU-session-aware bidirectional streaming RPC for stateful inference fleets"
license = "Apache-2.0"
repository = "https://github.com/EvalOps/sessionrpc"
readme = "README.md"
keywords = ["rpc", "streaming", "inference", "gpu", "sessions"]
categories = ["network-programming", "asynchronous"]

[dependencies]
axum = "0.8"
bytes = "1.11"
quinn = "0.11.9"
rcgen = "0.14.5"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.20", features = ["v4"] }
